<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13 Paarbon Authentication Demo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@400;500;600&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#480008;color:#fff;font-family:"Intel One Mono",monospace;min-height:100vh;overflow:auto}.bg{position:fixed;inset:-4%;background:url('../public/images/auth-bg.jpg') center/cover;z-index:-3;animation:move 14s ease-in-out infinite alternate}.bg:after{content:"";position:absolute;inset:0;background:rgba(45,0,5,.18)}.nav{display:flex;justify-content:center;gap:42px;padding:60px 18px 0}.nav span{font-size:18px}.stage{width:min(1350px,92vw);margin:100px auto 50px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.card{padding:32px 24px 38px;min-height:420px;border:1px solid rgba(255,255,255,.25);border-radius:28px;background:linear-gradient(rgba(150,9,17,.76),rgba(130,7,15,.8)),url('../public/images/auth-texture.jpg') center/cover;box-shadow:0 30px 80px rgba(0,0,0,.3);transition:.45s}.card:hover{transform:translateY(-10px) rotateX(2deg) rotateY(-1deg);box-shadow:0 42px 100px rgba(0,0,0,.42)}.admin{opacity:.88;transform:scale(.96)}.title,.btn{border:1px solid rgba(255,255,255,.82);padding:15px 20px;text-align:center;font-size:20px}.actions{margin-top:30px;border:1px solid rgba(255,255,255,.75);padding:25px 16px;display:flex;flex-direction:column;gap:18px;align-items:center}.btn{background:transparent;color:#fff;cursor:pointer;width:min(270px,100%);font:inherit;font-size:16px}.btn:hover{background:rgba(255,255,255,.08)}.or{text-align:center}.backdrop{position:fixed;inset:0;background:rgba(20,0,4,.52);backdrop-filter:blur(4px);display:none;place-items:center;padding:20px}.backdrop.open{display:grid}.modal{width:min(650px,92vw);max-height:88vh;overflow:auto;padding:28px 40px 40px;background:linear-gradient(rgba(166,20,28,.9),rgba(137,7,15,.92)),url('../public/images/auth-texture.jpg') center/cover;border:1px solid #fff;box-shadow:0 35px 100px #150005}.x{float:right;background:transparent;border:0;color:#fff;font:inherit;font-size:22px;cursor:pointer}.modal-title{display:table;margin:0 auto 25px;border:1px solid #fff;padding:12px 22px;font-size:18px}.field{display:block;margin:14px 0}.field span{display:block;font-size:11px;margin-bottom:7px}.field input{width:100%;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75);padding:10px;font:inherit}.submit{display:block;margin:22px auto 0}.demo-note{text-align:center;font-size:10px;opacity:.72;margin-top:22px}.account{display:none;width:min(1000px,92vw);margin:80px auto;background:linear-gradient(rgba(166,20,28,.9),rgba(137,7,15,.92)),url('../public/images/auth-texture.jpg') center/cover;border:1px solid #fff;padding:30px}.account.open{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid div{border:1px solid rgba(255,255,255,.5);padding:15px}.grid span{display:block;font-size:9px;opacity:.7;margin-bottom:8px}.grid b{font-size:12px;font-weight:400}.hidden{display:none}@keyframes move{from{transform:scale(1.02)}to{transform:scale(1.08) translateY(-.7%)}}@media(max-width:850px){.stage{grid-template-columns:1fr;margin-top:55px}.card{min-height:auto}.nav{gap:17px}.nav span{font-size:11px}.grid{grid-template-columns:1fr}.modal{padding:25px 18px 30px}}
</style></head><body><div class="bg"></div><div class="nav"><span>HOME</span><span>PUJO</span><span>BLOG</span><span>ABOUT</span><span>LOGIN</span></div><section class="stage" id="stage"><article class="card admin"><div class="title">ADMIN LOGIN</div><div class="actions"><button class="btn" data-role="Admin">Sign in</button><div class="or">/</div><button class="btn" data-register="Admin">Create a<br>Account</button></div></article><article class="card"><div class="title">USER LOGIN</div><div class="actions"><button class="btn" data-role="User">Sign in</button><div class="or">/</div><button class="btn" data-register="User">Create a<br>Account</button></div></article><article class="card"><div class="title">Editor LOGIN</div><div class="actions"><button class="btn" data-role="Editor">Sign in</button><div class="or">/</div><button class="btn" data-register="Editor">Create a<br>Account</button></div></article></section><section class="account" id="account"><h2 style="font-size:18px;font-weight:400">ACCOUNT — DEMO</h2><div class="grid"><div><span>NAME</span><b>Demo Account</b></div><div><span>USERNAME</span><b>demo_user</b></div><div><span>ROLE</span><b id="demoRole">User</b></div><div><span>ID</span><b id="demoId">USR-DEMO01</b></div><div><span>EMAIL</span><b>demo@example.com</b></div><div><span>PHONE</span><b>+91XXXXXXXXXX</b></div></div><button class="btn" style="margin-top:20px" onclick="location.reload()">SIGN OUT DEMO</button></section><div class="backdrop" id="backdrop"><div class="modal"><button class="x" onclick="closeModal()">×</button><div class="modal-title" id="modalTitle">User Sign-in</div><form onsubmit="demoSubmit(event)"><label class="field"><span id="idLabel">Enter your User ID / Username</span><input required></label><label class="field"><span>Enter Password</span><input type="password" required></label><button class="btn submit">SIGN IN</button><div style="text-align:center;margin:16px 0;font-size:11px">OR</div><button type="button" class="btn" onclick="demoSubmit(event)">SIGN-IN WITH GOOGLE</button><div class="demo-note">VISUAL DEMO — backend actions are disabled in this preview.</div></form></div></div><script>let role='User';function openModal(r,reg){role=r;document.getElementById('modalTitle').textContent=reg?r+' Create Account':r+' Sign-in';document.getElementById('idLabel').textContent=reg?'Enter a '+r+' Username':'Enter your '+r+' ID / Username';document.querySelector('.modal form').innerHTML=reg?'<label class="field"><span>Enter Your Name</span><input required></label><label class="field"><span>Enter your Gmail ID</span><input type="email" required></label><label class="field"><span>Enter your Ph. Number</span><input placeholder="+91XXXXXXXXXX" required></label><label class="field"><span>Enter a '+r+' Username</span><input required></label><label class="field"><span>Create Password</span><input type="password" required></label><label class="field"><span>Confirm Password</span><input type="password" required></label><button class="btn submit">CREATE ACCOUNT</button><div style="text-align:center;margin:16px 0;font-size:11px">OR</div><button type="button" class="btn" onclick="demoSubmit(event)">LOGIN WITH GOOGLE</button><div class="demo-note">VISUAL DEMO — backend actions are disabled in this preview.</div>':'<label class="field"><span>Enter your '+r+' ID / Username</span><input required></label><label class="field"><span>Enter Password</span><input type="password" required></label><button class="btn submit">SIGN IN</button><div style="text-align:center;margin:16px 0;font-size:11px">OR</div><button type="button" class="btn" onclick="demoSubmit(event)">SIGN-IN WITH GOOGLE</button><div class="demo-note">VISUAL DEMO — backend actions are disabled in this preview.</div>';document.getElementById('backdrop').classList.add('open')}function closeModal(){document.getElementById('backdrop').classList.remove('open')}function demoSubmit(e){e.preventDefault();closeModal();document.getElementById('stage').classList.add('hidden');document.getElementById('account').classList.add('open');document.getElementById('demoRole').textContent=role;document.getElementById('demoId').textContent=(role==='Admin'?'ADM':role==='Editor'?'EDT':'USR')+'-DEMO01';}</script></body></html>
